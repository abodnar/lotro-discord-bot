[pytest]
testpaths = tests
pythonpath = source
asyncio_mode = auto
filterwarnings =
    # dateparser is pinned to 1.1.7 (see requirements.txt), which still calls datetime.utcnow()
    ignore:datetime.datetime.utcnow:DeprecationWarning:dateparser
    # Surface leaked connections/files; Python hides ResourceWarning by default.
    default::ResourceWarning
